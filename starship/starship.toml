"$schema" = 'https://starship.rs/config-schema.json'

add_newline =  true
scan_timeout = 3000

palette = "catppuccin_macchiato"

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo  = "#f0c6c6"
pink      = "#f5bde6"
mauve     = "#c6a0f6"
red       = "#ed8796"
maroon    = "#ee99a0"
peach     = "#f5a97f"
yellow    = "#eed49f"
green     = "#a6da95"
teal      = "#8bd5ca"
sky       = "#91d7e3"
sapphire  = "#7dc4e4"
blue      = "#8aadf4"
lavender  = "#b7bdf8"
text      = "#cad3f5"
subtext1  = "#b8c0e0"
subtext0  = "#a5adcb"
overlay2  = "#939ab7"
overlay1  = "#8087a2"
overlay0  = "#6e738d"
surface2  = "#5b6078"
surface1  = "#494d64"
surface0  = "#363a4f"
base      = "#24273a"
mantle    = "#1e2030"
crust     = "#181926"

[character]
success_symbol = "[↳](bold green)"
error_symbol = "[↳](bold red)"


[docker_context]
disabled = true

[directory]
style = "fg:green"
truncation_length = 3
truncation_symbol = "‣/"

[kubernetes]
style = "fg:blue"
disabled = false
# GKE: gke_<projeto>_<região>_<cluster> -> <cluster>; ⚠️ quando o nome tem "prod"
[[kubernetes.contexts]]
context_pattern = "gke_[^_]+_[^_]+_(?P<var_cluster>[\\w-]*prod[\\w-]*)"
context_alias = "$var_cluster"
symbol = "⚠️  "
style = "bold red"
[[kubernetes.contexts]]
context_pattern = ".*prod.*"
symbol = "⚠️  "
style = "bold red"
[[kubernetes.contexts]]
context_pattern = "gke_[^_]+_[^_]+_(?P<var_cluster>[\\w-]+)"
context_alias = "$var_cluster"

[gcloud]
style = "fg:45"
format = "on [$symbol$project|$domain]($style)"
symbol = "Ⓖ "
disabled = true

[nodejs]
disabled = true

[aws]
format = 'on [$symbol($profile) ]($style)'
style = "fg:214"
symbol = "🅰 "
disabled = true

[helm]
disabled = false 

[package]
disabled = true

[git_branch]
symbol = " "
style = "fg:pink"
format = "[$symbol $branch]($style) "

[git_metrics]
added_style = "fg:green"
deleted_style = "fg:red"
format = '[+$added]($added_style)|[-$deleted]($deleted_style) '
only_nonzero_diffs = false
disabled = false

[git_status]
style = "fg:yellow"
format = '[$all_status$ahead_behind]($style) '
conflicted = "≠"
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
up_to_date = ""
untracked = "?"
stashed = "✦"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[terraform]
format = "via [$symbol$version]($style)"
detect_folders = [".terraform"]
disabled = true
style = "fg:33"

[battery]
disabled = true

[cmd_duration]
format = " took [$duration](bold yellow)"
